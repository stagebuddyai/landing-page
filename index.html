<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stage Buddy — Performance Intelligence</title>
  <meta name="description" content="Your performance has a score. Do you know it? S.T.A.R.R. Audits for spoken word artists and performers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:      #0a0a0a;
      --deep:       #111111;
      --surface:    #161616;
      --gold:       #c9a84c;
      --gold-soft:  #e2c27d;
      --gold-dim:   #7a6030;
      --white:      #f4f0e8;
      --muted:      #888880;
      --border:     rgba(201,168,76,0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.5;
    }

    .glow-top {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      gap: 0;
    }

    .mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 52px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.1s;
    }

    .mark-icon {
      width: 48px;
      height: 48px;
      border: 1.5px solid var(--gold-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .mark-icon::after {
      content: '★';
      font-size: 20px;
      color: var(--gold);
      line-height: 1;
    }

    .brand-name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    .headline {
      text-align: center;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.3s;
    }

    .headline h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 8vw, 62px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 6px;
    }

    .headline h1 em {
      font-style: italic;
      color: var(--gold-soft);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 24px auto;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 0.5s;
    }

    .pillars {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 42px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.5s;
    }

    .pillar {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 2px;
    }

    .sub {
      text-align: center;
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 420px;
      margin-bottom: 52px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.65s;
    }

    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.8s;
    }

    .cta-btn {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 18px 48px;
      border-radius: 2px;
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
      box-shadow: 0 0 0 0 rgba(201,168,76,0);
    }

    .cta-btn:hover {
      background: var(--gold-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(201,168,76,0.22);
    }

    .cta-sub {
      font-size: 11.5px;
      color: var(--gold-dim);
      letter-spacing: 0.08em;
    }

    .footer {
      margin-top: 80px;
      padding-bottom: 36px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.1s;
    }

    .footer p {
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    .bottom-line {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, var(--gold-dim), transparent);
      margin: 36px auto 0;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 480px) {
      .wrap { padding: 0 22px; }
      .pillars { flex-wrap: wrap; justify-content: center; }
      .cta-btn { padding: 16px 36px; }
    }
  </style>
</head>
<body>

  <div class="glow-top"></div>

  <div class="wrap">

    <div class="mark">
      <div class="mark-icon"></div>
      <span class="brand-name">Stage Buddy</span>
    </div>

    <div class="headline">
      <h1>Your performance<br>has a <em>score.</em></h1>
    </div>

    <div class="divider"></div>

    <div class="pillars">
      <span class="pillar">Spirit</span>
      <span class="pillar">Chest</span>
      <span class="pillar">Body</span>
      <span class="pillar">Audience</span>
    </div>

    <p class="sub">
      Performance intelligence for spoken word artists.<br>
      We score what judges feel but can't explain.
    </p>

    <div class="cta-wrap">
      <a class="cta-btn" href="YOUR_INTAKE_FORM_URL_HERE" target="_blank" rel="noopener">
        Get Your S.T.A.R.R. Score
      </a>
      <span class="cta-sub">Audits delivered within 48 hours</span>
    </div>

    <div class="bottom-line"></div>

    <div class="footer">
      <p>&copy; 2026 B Rock &amp; Co &nbsp;&middot;&nbsp; Stage Buddy</p>
    </div>

  </div>

</body>
</html>
